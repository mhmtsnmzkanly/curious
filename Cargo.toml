[package]
name = "curious"
version = "0.1.0"
edition = "2024"

[dependencies]
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
tiny_http = "0.12"
flate2 = "1"
tempfile = "3"
zstd = "0.13"

# Keep development/test artifacts small on the shared server.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
